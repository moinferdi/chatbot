name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  phpstan:
    name: PHPStan (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-php@v6
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring

      - run: composer install --no-progress --no-interaction

      - run: composer phpstan

  tests:
    name: PHPUnit (PHP ${{ matrix.php }} · TYPO3 ${{ matrix.typo3 }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
        typo3: ['^13.4']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-php@v6
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring

      - run: composer require --no-progress --no-interaction typo3/cms-core:${{ matrix.typo3 }}

      - run: composer test
