services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Moinferdi\Chatbot\:
    resource: "../Classes/*"
    exclude: "../Classes/Dto/*"

  Moinferdi\Chatbot\DataProcessing\ChatbotConfigProcessor:
    tags:
      - name: "data.processor"
        identifier: "chatbot-config"

  # Dedicated HTTP client with upstream timeouts
  chatbot.guzzle_client:
    class: GuzzleHttp\Client
    arguments:
      $config:
        timeout: 30
        connect_timeout: 5
        http_errors: false

  Moinferdi\Chatbot\Service\ChatClient:
    arguments:
      $httpClient: '@chatbot.guzzle_client'

  # Expose the custom cache as a DI service (TYPO3 only auto-registers core caches).
  cache.chatbot_ratelimit:
    class: TYPO3\CMS\Core\Cache\Frontend\FrontendInterface
    factory: ['@TYPO3\CMS\Core\Cache\CacheManager', 'getCache']
    arguments:
      - 'chatbot_ratelimit'

  Moinferdi\Chatbot\Service\RateLimiter:
    arguments:
      $cache: '@cache.chatbot_ratelimit'
