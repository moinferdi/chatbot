services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Moinferdi\Chatbot\:
    resource: "../Classes/*"
    exclude: "../Classes/Dto/*"

  Moinferdi\Chatbot\DataProcessing\ChatbotConfigProcessor:
    tags:
      - name: "data.processor"
        identifier: "chatbot-config"
